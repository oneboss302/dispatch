name: Update dispatch

on:
  schedule:
    - cron: "*/5 * * * *"    # GitHub's minimum; scheduled runs can start a few minutes late
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [archive/**, state/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Call history and geocoding cache carry over between runs via the Actions cache
      - uses: actions/cache/restore@v4
        with:
          path: state/history.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Build
        run: |
          python3 build.py state _site
          cp index.html _site/
          echo "dispatch.castafero.com" > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state/history.json
          key: state-${{ github.run_id }}
      - name: Daily archive (keeps a record and keeps the schedule active)
        if: github.event_name == 'schedule'
        run: |
          [ "$(date -u +%H)" = "10" ] || exit 0
          day=$(TZ=America/New_York date -d yesterday +%F)
          [ -f "archive/$day.json" ] && exit 0
          python3 - "$day" <<'PY'
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day = sys.argv[1]
          calls = json.load(open("state/history.json"))
          keep = [c for c in calls if datetime.fromisoformat((c.get("dispatched") or c["first_seen"]).replace("Z", "+00:00")).astimezone(ZoneInfo("America/New_York")).strftime("%F") == day]
          json.dump(keep, open(f"archive/{day}.json", "w"), indent=0)
          print(len(keep), "calls archived for", day)
          PY
          git config user.name "dispatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive state/geocache.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Archive calls for $day"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
